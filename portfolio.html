<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portföy Takipçisi | KriptoAnaliz TR</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="imagine_images/Jzurw.jpg" type="image/jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="imagine_images/Jzurw.jpg" alt="Logo" class="logo-img">
                <a href="index.html" style="color:inherit; text-decoration:none">KriptoAnaliz <span class="accent">TR</span></a>
            </div>
            <nav class="nav-links">
                <a href="index.html">Ana Sayfa</a>
                <a href="portfolio.html">Portföy</a>
            </nav>
            <button class="menu-toggle" id="menuToggle">☰</button>
        </div>
    </header>

    <main class="section">
        <h1>Portföy Takipçisi</h1>
        <p style="color:var(--text-muted); margin-bottom:2rem">Coinlerinizi ve miktarlarınızı ekleyin. Toplam değeriniz otomatik hesaplanır (LocalStorage ile saklanır).</p>

        <div class="analysis-card" style="margin-bottom:2rem; max-width:600px">
            <h3>Coin Ekle</h3>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:1rem">
                <input id="coinInput" placeholder="Coin ID (ör: bitcoin, ethereum)" style="flex:1; padding:0.7rem; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text)">
                <input id="amountInput" type="number" step="any" placeholder="Miktar" style="width:120px; padding:0.7rem; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text)">
                <button id="addBtn" style="padding:0.7rem 1.2rem; background:var(--accent); color:#000; border:none; border-radius:8px; font-weight:600; cursor:pointer">Ekle</button>
            </div>
            <p style="font-size:0.85rem; color:var(--text-muted); margin-top:0.5rem">Coin ID'leri CoinGecko formatındadır (bitcoin, ethereum, solana vb.)</p>
        </div>

        <div id="portfolioSummary" class="global-stats" style="margin-bottom:2rem"></div>
        <div id="portfolioList"></div>
    </main>

    <footer>
        <div class="footer-content">
            <p>© 2026 KriptoAnaliz TR</p>
        </div>
    </footer>

    <script src="portfolio.js"></script>
</body>
</html>
